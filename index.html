  <style>
    :root {
      --bg-color: #141414;
      --text-color: #e5e5e5;
      --accent-color: #e50914;
      --card-bg: #141414;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: "Roboto", sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Hero Section */
    .hero {
      height: 50vh;
      position: relative;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 20px 4%;
      margin-bottom: 10px;
    }

    .hero::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(to top, var(--bg-color), transparent 50%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 600px;
      text-align: left;
    }

    .hero-title {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
    }

    .hero-desc {
      font-size: 1.1rem;
      margin-bottom: 20px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
    }

    .hero-btn {
      background-color: white;
      color: black;
      padding: 10px 25px;
      border-radius: 4px;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    .hero-btn:hover {
      opacity: 0.8;
    }
    
    /* Navigation Bar & Category Header */
    .nav-bar {
      padding: 10px 4%;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn {
      background: transparent;
      color: white;
      border: 1px solid white;
      padding: 5px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .category-header {
      padding: 10px 4%;
      display: none;
      flex-direction: column;
      margin-bottom: 10px;
      background-color: var(--bg-color);
      border-bottom: 1px solid #333;
    }

    .category-title {
      font-size: 1.8rem;
      font-weight: bold;
      margin: 0;
    }

    .category-subtitle {
      font-size: 1rem;
      color: #aaa;
      margin-top: 5px;
      max-width: 700px;
    }

    /* Main Container & Grid */
    .main-container {
      padding: 0 4%;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    
    /* Card Styles */
    .card {
      background-color: #1f1f1f;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      border: 1px solid #333;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      border-color: #555;
    }

    .card img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.4s ease;
    }

    .card:hover img {
      transform: scale(1.03);
    }

    .card-content {
      padding: 20px;
    }

    .card-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 40%;
      pointer-events: none;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: white;
      margin-bottom: 8px;
    }

    .card-subtitle {
      font-size: 0.95rem;
      color: #aaa;
      line-height: 1.4;
    }

    /* Course Banner Wrapper */
    .course-banner-wrapper {
      grid-column: 1 / -1; 
      background-color: #2f2f2f;
      border-radius: 8px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 25px;
      border: 1px solid #444;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    @media (min-width: 768px) {
      .course-banner-wrapper {
        flex-direction: row;
        text-align: left;
        align-items: center;
        padding: 40px;
      }
    }

    .course-banner-img {
      max-width: 280px;
      height: auto;
      border-radius: 8px;
      margin-bottom: 20px;
      object-fit: contain;
    }

    @media (min-width: 768px) {
      .course-banner-img {
        margin-bottom: 0;
        margin-right: 40px;
        max-width: 350px;
      }
    }

    .course-banner-text {
      flex: 1;
    }

    .course-banner-title {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 15px;
      color: white;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .course-banner-desc {
      font-size: 1.1rem;
      color: #ddd;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #181818;
      width: 90%;
      max-width: 800px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 20px;
      z-index: 10;
    }

    .modal-image {
      width: 100%;
      height: 300px;
      object-fit: contain;
      background-color: #000;
    }

    .modal-details {
      padding: 30px;
      text-align: left;
      overflow-y: auto;
      width: 100%;
      box-sizing: border-box;
    }

    .modal-title {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .modal-desc {
      color: #aaa;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .btn-primary {
      background-color: white;
      color: black;
      padding: 12px 30px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
      border: none;
    }

    .btn-primary:hover {
      opacity: 0.85;
    }
    
    /* WhatsApp Float */
    .whatsapp-float {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #25D366;
      color: white;
      padding: 12px 20px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      z-index: 900;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    /* Desktop Grid */
    @media (min-width: 768px) {
      .grid-container {
        grid-template-columns: repeat(3, 1fr);
      }

      .modal-content {
        flex-direction: row;
      }

      .modal-image {
        width: 50%;
        height: auto;
      }

      .modal-details {
        width: 50%;
      }
    }
  </style>
</head>

<body>

<script>

    let allData = {};

    const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbxTGQQZWDLXcfMtMbOH9c98PfH5cQgu5lIzK6jw9vBP-9NLR_RlmX28fDSpd92UZbZU/exec"; 

    const FALLBACK_IMG = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='600' height='400' viewBox='0 0 600 400'%3E%3Crect width='600' height='400' fill='%23222222'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' fill='%23666666' font-family='Roboto, sans-serif' font-size='20'%3ESin Imagen%3C/text%3E%3C/svg%3E";


    /* ==========================================================
       CARGA INICIAL
       ========================================================== */

    document.addEventListener("DOMContentLoaded", () => {

      if (!API_ENDPOINT || API_ENDPOINT.includes("TU_URL")) {
        console.error("Error: API_ENDPOINT no está configurado correctamente.");
        return;
      }

      fetch(API_ENDPOINT)
        .then(res => res.json())
        .then(initApp)
        .catch(err => console.error('Error al cargar datos:', err));

    });


    /* ==========================================================
       INICIALIZACIÓN
       ========================================================== */

    function initApp(data) {

      const urlParams = new URLSearchParams(window.location.search);
      const modo = urlParams.get('modo');

      if (modo === 'clientes' && data.categories) {

        data.categories = data.categories.map(cat => {

          cat.products = cat.products.filter(prod => {

            const nombreProd = (prod.name || "").toLowerCase();

            return !nombreProd.includes("gratis") &&
                   !nombreProd.includes("gratuito");

          });

          return cat;

        }).filter(cat => cat.products.length > 0);
      }

      allData = data;

      if (data.config?.backgroundColor) {
        document.body.style.backgroundColor = data.config.backgroundColor;
      }

      if (data.config?.whatsappUrl) {
        document.getElementById("whatsapp-btn").href =
          data.config.whatsappUrl;
      }

      renderHome();
    }


    /* ==========================================================
       BUSCAR TEXTO DEL BOTÓN DE UNA CATEGORÍA
       ========================================================== */

    function getCategoryButtonText(categoryName) {

      const listasConfig = allData.listas || [];

      const normalizedName = (categoryName || "")
        .trim()
        .toLowerCase();

      const item = listasConfig.find(item => {

        const name = (
          item.Category ||
          item.name ||
          ""
        ).trim().toLowerCase();

        return (
          name === normalizedName ||
          name.includes(normalizedName) ||
          normalizedName.includes(name)
        );

      });

      return (
        item?.BotonTexto ||
        item?.botonTexto ||
        item?.buttonText ||
        "Más información"
      );
    }


  /* ==========================================================
       HOME
       ========================================================== */

    function renderHome() {

      document.getElementById("category-header").style.display = "none";

      document.getElementById("hero").style.display = "flex";

      renderHeroSection();

      document.getElementById("nav-bar").style.display = "none";

      const grid = document.getElementById("grid-container");

      grid.innerHTML = "";

      const listasConfig = allData.listas || [];

      if (listasConfig.length === 0) return;


      listasConfig.forEach((item, index) => {

        const rawCatName =
          (item.Category || item.name || "").trim();

        const catNameLower =
          rawCatName.toLowerCase();

        const displayTitle =
          item.Titulo ||
          item.title ||
          rawCatName;

        const displaySubtitle =
          item.Subtitulo ||
          item.subtitulo ||
          item.subtitle ||
          '';

        const displayImg =
          item.ImageUrl ||
          item.image ||
          FALLBACK_IMG;

        const displayCTA =
          item.CTA ||
          item.cta ||
          "Ver más";

        const buttonText =
          item.BotonTexto ||
          item.botonTexto ||
          item.buttonText ||
          "Más información";


        const isFree =
          catNameLower.includes("gratis") ||
          catNameLower.includes("gratuito");


        /* ======================================================
           CURSO GRATUITO
           ====================================================== */

        if (isFree) {

          let freeProduct = null;

          allData.categories?.forEach(cat => {

            cat.products?.forEach(prod => {

              const pName =
                (prod.name || "").toLowerCase();

              if (
                pName.includes("gratis") ||
                pName.includes("gratuito")
              ) {
                freeProduct = {
                  ...prod,
                  buttonText: buttonText
                };
              }

            });

          });


          const bannerDiv =
            document.createElement("div");

          bannerDiv.className =
            "course-banner-wrapper";


          const productPayload =
            freeProduct || {
              name: displayTitle,
              detail: displaySubtitle,
              image: displayImg,
              buttonText: buttonText
            };


          const productData =
            JSON.stringify(productPayload)
              .replace(/"/g, '&quot;');


          bannerDiv.innerHTML = `

            <img
              class="course-banner-img"
              src="${displayImg}"
              alt="${displayTitle}"
              onerror="this.src='${FALLBACK_IMG}'"
            >

            <div class="course-banner-text">

              <h2 class="course-banner-title">
                ${displayTitle}
              </h2>

              <p class="course-banner-desc">
                ${displaySubtitle}
              </p>

              <button
                class="hero-btn"
                data-product="${productData}"
                onclick="handleBannerClick(this)"
              >
                ${displayCTA}
              </button>

            </div>

          `;

          grid.appendChild(bannerDiv);


        } else {

          /* ====================================================
             CATEGORÍA NORMAL / TARJETAS INFERIORES
             ==================================================== */

          const card =
            document.createElement("div");

          card.className = "card";


          card.onclick = () => {

            // REQUISITO 1: Primera tarjeta de abajo a la izquierda redirige a URL externa
            if (index === 1 || catNameLower.includes("ruta") || catNameLower.includes("pack")) {
              window.open("https://hugo85ar.github.io/LandingPacks/", "_blank");
              return;
            }

            const matchedCat =
              allData.categories?.find(c => {

                const cName =
                  (c.name || "")
                    .trim()
                    .toLowerCase();

                return (
                  cName === catNameLower ||
                  cName.includes(catNameLower) ||
                  catNameLower.includes(cName)
                );

              });


            if (matchedCat) {

              matchedCat.buttonText =
                buttonText;

              renderCategoryView(matchedCat);

            } else {

              console.warn(
                "No se encontró categoría para:",
                rawCatName
              );

            }

          };


          card.innerHTML = `

            <img
              src="${displayImg}"
              alt="${displayTitle}"
              onerror="this.src='${FALLBACK_IMG}'"
            >

            <div class="card-overlay">

              <div class="card-title">
                ${displayTitle}
              </div>

              <div class="card-subtitle">
                ${displaySubtitle}
              </div>

            </div>

          `;

          grid.appendChild(card);

        }

      });

    }
  
   /* ==========================================================
       VISTA DE CATEGORÍA
       ========================================================== */

    function renderCategoryView(category) {

      document.getElementById("hero").style.display =
        "none";

      const catHeader =
        document.getElementById("category-header");

      document.getElementById("category-title").textContent =
        category.name;

      document.getElementById("category-subtitle").textContent =
        `Explora los recursos disponibles en esta sección.`;

      catHeader.style.display =
        "flex";

      document.getElementById("nav-bar").style.display =
        "flex";

      const grid =
        document.getElementById("grid-container");

      grid.innerHTML = "";

      const categoryButtonText =
        category.buttonText ||
        getCategoryButtonText(category.name);

      if (category.products) {
        category.products.sort((a, b) => {
          return (a.name || "")
            .localeCompare(
              b.name || "",
              undefined,
              { numeric: true }
            );
        });
      }

      const isSuscripcionMensual = category.name.toLowerCase().includes("suscripción mensual") || category.name.toLowerCase().includes("suscripciones");

      category.products?.forEach(prod => {

        const card =
          document.createElement("div");

        card.className =
          "card";

        // REQUISITO 2: Si es la categoría de Soluciones con Suscripción mensual, forzamos el texto del botón y enlace de WhatsApp
        let prodButtonText = categoryButtonText;
        let modifiedProd = { ...prod };

        if (isSuscripcionMensual) {
          prodButtonText = "Saber más";
          const whatsappBaseUrl = allData.config?.whatsappUrl || "https://wa.me/";
          const mensajeWa = encodeURIComponent(`Hola Hugo, quiero saber más sobre la solución: ${prod.name}`);
          
          // Si whatsappUrl ya tiene un número o estructura base, lo adaptamos o usamos el predeterminado con mensaje
          let finalWaUrl = whatsappBaseUrl.includes("?") ? `${whatsappBaseUrl}&text=${mensajeWa}` : `${whatsappBaseUrl}?text=${mensajeWa}`;
          if (!whatsappBaseUrl.includes("wa.me") && !whatsappBaseUrl.includes("whatsapp")) {
             finalWaUrl = `https://wa.me/5491132338144?text=${mensajeWa}`; // Fallback seguro si fuera necesario
          }

          modifiedProd.buyUrlContado = finalWaUrl;
        }

        const productWithButton = {
          ...modifiedProd,
          buttonText: prodButtonText
        };

        card.onclick = () =>
          window.openModal(productWithButton);

        card.innerHTML = `

          <img
            src="${prod.image || prod.imageUrl || FALLBACK_IMG}"
            alt="${prod.name}"
            onerror="this.src='${FALLBACK_IMG}'"
          >

          <div class="card-content">

            <div class="card-title">
              ${prod.name}
            </div>

            <div class="card-subtitle">
              ${prod.detail || ''}
            </div>

          </div>

        `;

        grid.appendChild(card);

      });

      window.scrollTo(0, 0);

    }    
  }

  </script>

</body>
