<!DOCTYPE html>
<html>
<head>
  <base target="_top" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
 
  <!-- META PIXEL -->
  <script>

    <img
      height="1"

      src="https://www.facebook.com/tr?id=2189151328193841&ev=PageView&noscript=1"

  <style>
    :root {
      --bg-color: #141414;
      --text-color: #e5e5e5;
      --accent-color: #e50914;
      --card-bg: #141414;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: "Roboto", sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Hero Section */
    .hero {
      height: 55vh;
      position: relative;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 30px 4%;
      margin-bottom: 20px;
    }

    .hero::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(to top, var(--bg-color), rgba(20,20,20,0.2) 60%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 650px;
      text-align: left;
    }

    .hero-title {
      font-size: 2.8rem;
      font-weight: bold;
      margin-bottom: 10px;
      text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.8);
    }

    .hero-desc {
      font-size: 1.15rem;
      margin-bottom: 20px;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
      line-height: 1.4;
    }

    .hero-btn {
      background-color: white;
      color: black;
      padding: 12px 28px;
      border-radius: 4px;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    .hero-btn:hover {
      opacity: 0.85;
    }
   
    /* Navigation Bar & Category Header */
    .nav-bar {
      padding: 10px 4%;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn {
      background: transparent;
      color: white;
      border: 1px solid white;
      padding: 6px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .category-header {
      padding: 15px 4%;
      display: none;
      flex-direction: column;
      margin-bottom: 15px;
      background-color: var(--bg-color);
      border-bottom: 1px solid #333;
    }

    .category-title {
      font-size: 2rem;
      font-weight: bold;
      margin: 0;
    }

    .category-subtitle {
      font-size: 1.05rem;
      color: #aaa;
      margin-top: 8px;
      max-width: 750px;
    }

    /* Main Container & Grid */
    .main-container {
      padding: 0 4% 40px 4%;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
   
    /* Card Styles */
    .card {
      background-color: #1f1f1f;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      border: 1px solid #333;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      border-color: #555;
    }

    .card img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.4s ease;
    }

    .card:hover img {
      transform: scale(1.03);
    }

    .card-content {
      padding: 20px;
    }

    .card-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.95), rgba(0,0,0,0.6) 70%, transparent);
      padding: 20px 15px 15px 15px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: white;
      margin-bottom: 6px;
    }

    .card-subtitle {
      font-size: 0.9rem;
      color: #bbb;
      line-height: 1.3;
    }

    /* Course Banner Wrapper */
    .course-banner-wrapper {
      grid-column: 1 / -1;
      background-color: #1f1f1f;
      border-radius: 8px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 25px;
      border: 1px solid #333;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    @media (min-width: 768px) {
      .course-banner-wrapper {
        flex-direction: row;
        text-align: left;
        align-items: center;
        padding: 40px;
      }
    }

    .course-banner-img {
      max-width: 280px;
      height: auto;
      border-radius: 8px;
      margin-bottom: 20px;
      object-fit: contain;
    }

    @media (min-width: 768px) {
      .course-banner-img {
        margin-bottom: 0;
        margin-right: 40px;
        max-width: 350px;
      }
    }

    .course-banner-text {
      flex: 1;
    }

    .course-banner-title {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 15px;
      color: white;
    }

    .course-banner-desc {
      font-size: 1.1rem;
      color: #ccc;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #181818;
      width: 90%;
      max-width: 850px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      max-height: 90vh;
      border: 1px solid #333;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 20px;
      z-index: 10;
    }

    .modal-image {
      width: 100%;
      height: 280px;
      object-fit: contain;
      background-color: #000;
    }

    .modal-details {
      padding: 30px;
      text-align: left;
      overflow-y: auto;
      width: 100%;
      box-sizing: border-box;
    }

    .modal-title {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: white;
    }

    .modal-desc {
      color: #aaa;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
   
    .btn-primary {
      background-color: white;
      color: black;
      padding: 12px 30px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
      border: none;
      font-size: 1rem;
    }

    .btn-primary:hover {
      opacity: 0.85;
    }
   
    /* WhatsApp Float */
    .whatsapp-float {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #25D366;
      color: white;
      padding: 12px 20px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      z-index: 900;
      display: flex;
      align-items: center;
      gap: 8px;
    }
   
    /* Desktop Grid */
    @media (min-width: 768px) {
      .grid-container {
        grid-template-columns: repeat(3, 1fr);
      }

      .modal-content {
        flex-direction: row;
      }

      .modal-image {
        width: 50%;
        height: auto;
      }

      .modal-details {
        width: 50%;
      }
    }
  </style>
</head>

<body>

  <!-- Hero Section -->
  <div id="hero" class="hero" style="display: flex;">
    <div class="hero-content">
      <h1 id="hero-title" class="hero-title">Bienvenido</h1>
      <p id="hero-desc" class="hero-desc">Explora las herramientas y sistemas diseñados para escalar tu negocio.</p>
      <button id="hero-btn" class="hero-btn">Ver cursos</button>
    </div>
  </div>

  <!-- Navigation Bar & Category Header -->
  <div id="nav-bar" class="nav-bar" style="display: none;">
    <button class="back-btn" onclick="renderHome()">← Volver</button>
  </div>

  <div id="category-header" class="category-header">
    <h2 id="category-title" class="category-title"></h2>
    <p id="category-subtitle" class="category-subtitle"></p>
  </div>

  <!-- Main Content Grid -->
  <div id="main-container" class="main-container">
    <div id="grid-container" class="grid-container">
      <!-- Items will be injected here -->
    </div>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal(event)">×</button>
      <img id="modal-img" class="modal-image" src="" alt="">
      <div class="modal-details">
        <h2 id="modal-title" class="modal-title"></h2>
        <p id="modal-desc" class="modal-desc"></p>
        <div class="modal-actions">
          <a id="modal-buy-contado" href="#" target="_blank" rel="noopener noreferrer" class="btn-primary" style="display:none;"></a>
          <a id="modal-buy-3cuotas" href="#" target="_blank" rel="noopener noreferrer" class="btn-primary" style="display:none;">Pagar en 3 Cuotas</a>
          <a id="modal-buy-6cuotas" href="#" target="_blank" rel="noopener noreferrer" class="btn-primary" style="display:none;">Pagar en 6 Cuotas</a>
        </div>
      </div>
    </div>
  </div>

  <!-- WhatsApp -->
  <a id="whatsapp-btn" class="whatsapp-float" target="_blank" href="https://wa.me/">
    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
      <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.598 2.669-.699c.968.585 1.961.898 3.03.899 3.181 0 5.769-2.587 5.769-5.766.001-3.18-2.584-5.768-5.763-5.768zm7.693 5.766c-.001 4.244-3.453 7.695-7.692 7.695-1.285 0-2.488-.324-3.516-.892l-4.133 1.083 1.107-4.029c-.631-1.08-1.006-2.338-1.006-3.857 0-4.245 3.451-7.698 7.695-7.698 4.245 0 7.695 3.453 7.695 7.698zm-3.446 2.323c-.191-.095-1.134-.56-1.311-.624-.176-.064-.303-.096-.432-.096-.127.192-.495.624-.605.752-.111.128-.224.144-.415.048-.192-.096-.8-.384-1.456-.752-.64-.368-1.072-.816-1.312-1.168-.24-.352-.025-.544.128-.704.131-.131.296-.336.448-.504.152-.168.203-.288.304-.496.101-.208.05-.39-.025-.546-.075-.156-.665-1.6-.913-2.192-.24-.58-.48-.5-.656-.51-.17-.01-.365-.01-.56-.01-.192 0-.504.072-.768.352-.264.28-1.008.984-1.008 2.4 0 1.416 1.032 2.784 1.176 2.976.144.192 2.032 3.104 4.928 4.352.688.296 1.224.472 1.64.6.688.224 1.312.192 1.808.116.552-.084 1.704-.696 1.944-1.368.24-.672.24-1.248.168-1.368-.072-.12-.264-.192-.552-.336z"/>
    </svg>
    WhatsApp
  </a>

<script>
    let allData = {};
    const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbxTGQQZWDLXcfMtMbOH9c98PfH5cQgu5lIzK6jw9vBP-9NLR_RlmX28fDSpd92UZbZU/exec";
    const FALLBACK_IMG = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='600' height='400' viewBox='0 0 600 400'%3E%3Crect width='600' height='400' fill='%23222222'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' fill='%23666666' font-family='Roboto, sans-serif' font-size='20'%3ESin Imagen%3C/text%3E%3C/svg%3E";

    document.addEventListener("DOMContentLoaded", () => {
      if (!API_ENDPOINT || API_ENDPOINT.includes("TU_URL")) {
        console.error("Error: API_ENDPOINT no está configurado.");
        return;
      }
      fetch(API_ENDPOINT)
        .then(res => res.json())
        .then(initApp)
        .catch(err => console.error('Error al cargar datos:', err));
    });

    function initApp(data) {
      allData = data;
      renderHeroSection();
      renderHome();
    }

    function renderHeroSection() {
      const heroConfig = allData.hero || (Array.isArray(allData.configuracion) ? allData.configuracion[0] : {}) || {};
      
      document.getElementById("hero-title").textContent = heroConfig.titulo || heroConfig.title || "Bienvenido";
      document.getElementById("hero-desc").textContent = heroConfig.subtitulo || heroConfig.subtitle || heroConfig.descripcion || "Explora las herramientas y sistemas diseñados para escalar tu negocio.";
      
      // Imagen de fondo fija/respaldo para asegurar que siempre cargue la cabecera visualmente
      const bgImg = heroConfig.imageUrl || heroConfig.imagenFondo || heroConfig.image || heroConfig.fondo || "https://res.cloudinary.com/dlnrsadbc/image/upload/q_auto,f_auto,w_1200/v1785273907/caratula_suscripcion_mensual_espanol_vli4ly.png";
      document.getElementById("hero").style.backgroundImage = `url('${bgImg}')`;

      const heroBtn = document.getElementById("hero-btn");
      heroBtn.textContent = heroConfig.ctaText || "Ver cursos";
      heroBtn.onclick = () => {
        window.scrollTo({ top: window.innerHeight * 0.5, behavior: 'smooth' });
      };
    }

    function renderHome() {
      document.getElementById("category-header").style.display = "none";
      document.getElementById("hero").style.display = "flex";
      document.getElementById("nav-bar").style.display = "none";

      const grid = document.getElementById("grid-container");
      grid.innerHTML = "";

      const listasConfig = allData.listas || [];
      if (listasConfig.length === 0) return;

      listasConfig.forEach((item) => {
        const rawCatName = (item.Category || item.category || item.name || "").trim();
        const catNameLower = rawCatName.toLowerCase();
        const displayTitle = item.Titulo || item.title || rawCatName;
        const displaySubtitle = item.Subtitulo || item.subtitulo || item.subtitle || item.descripcion || '';
        const displayImg = item.ImageUrl || item.image || item.imagen || FALLBACK_IMG;
        const displayCTA = item.CTA || item.cta || "Inscribirse";
        const buttonText = item.BotonTexto || item.botonTexto || item.buttonText || "Más información";
        
        // Detección del curso gratuito (Banner superior ancho)
        const isFree = catNameLower.includes("gratis") || catNameLower.includes("gratuito") || displayTitle.toLowerCase().includes("gratis");

        if (isFree) {
          let freeProduct = null;
          allData.categories?.forEach(cat => {
            cat.products?.forEach(prod => {
              const pName = (prod.name || "").toLowerCase();
              if (pName.includes("gratis") || pName.includes("gratuito")) {
                freeProduct = { ...prod };
              }
            });
          });

          const bannerDiv = document.createElement("div");
          bannerDiv.className = "course-banner-wrapper";

          const productPayload = freeProduct ? { ...freeProduct } : {
            name: displayTitle,
            detail: displaySubtitle,
            image: displayImg
          };

          productPayload.buyUrlContado = item.buyUrlContado || item.url || item.link || "https://hugo85ar.github.io/formulario-curso-sheets/";
          productPayload.buttonText = displayCTA;

          bannerDiv.innerHTML = `
            <img class="course-banner-img" src="${displayImg}" alt="${displayTitle}" onerror="this.src='${FALLBACK_IMG}'">
            <div class="course-banner-text">
              <h2 class="course-banner-title">${displayTitle}</h2>
              <p class="course-banner-desc">${displaySubtitle}</p>
              <button class="hero-btn" onclick='openModal(${JSON.stringify(productPayload)})'>${displayCTA}</button>
            </div>
          `;
          grid.appendChild(bannerDiv);
        } else {
          // Tarjetas inferiores (Carátulas)
          const card = document.createElement("div");
          card.className = "card";

          card.onclick = () => {
            // 1) Si es Landing Packs / Ruta del Emprendedor
            if (catNameLower.includes("ruta") || catNameLower.includes("pack") || catNameLower.includes("transformación") || catNameLower.includes("transformacion")) {
              window.open("https://hugo85ar.github.io/LandingPacks/", "_blank");
              return;
            }

            // 2) Si es Soluciones empaquetadas u otra categoría de la hoja Productos
            const targetCategoryName = "Soluciones empaquetadas (Soluciones con Suscripción mensual)";
            const matchedCat = allData.categories?.find(c => {
              const cName = (c.name || "").trim().toLowerCase();
              return cName.includes("suscripción") || cName.includes("suscripcion") || cName.includes("empaquetadas");
            });

            if (matchedCat) {
              matchedCat.buttonText = buttonText;
              renderCategoryView(matchedCat);
            } else {
              console.warn("Categoría no encontrada en productos.");
            }
          };

          card.innerHTML = `
            <img src="${displayImg}" alt="${displayTitle}" onerror="this.src='${FALLBACK_IMG}'">
            <div class="card-overlay">
              <div class="card-title">${displayTitle}</div>
              <div class="card-subtitle">${displaySubtitle}</div>
            </div>
          `;
          grid.appendChild(card);
        }
      });
    }
 
    function renderCategoryView(category) {
      document.getElementById("hero").style.display = "none";
      const catHeader = document.getElementById("category-header");
      document.getElementById("category-title").textContent = category.name;
      document.getElementById("category-subtitle").textContent = "Herramientas inteligentes y automatizaciones listas para usar en tu negocio.";
      catHeader.style.display = "flex";
      document.getElementById("nav-bar").style.display = "flex";

      const grid = document.getElementById("grid-container");
      grid.innerHTML = "";

      const categoryButtonText = category.buttonText || "Más información";

      category.products?.forEach(prod => {
        const card = document.createElement("div");
        card.className = "card";

        const productWithButton = {
          ...prod,
          buttonText: categoryButtonText
        };

        card.addEventListener('click', () => {
          openModal(productWithButton);
        });

        card.innerHTML = `
          <img src="${prod.image || prod.imageUrl || FALLBACK_IMG}" alt="${prod.name}" onerror="this.src='${FALLBACK_IMG}'">
          <div class="card-content">
            <div class="card-title">${prod.name}</div>
            <div class="card-subtitle">${prod.detail || prod.description || ''}</div>
          </div>
        `;

        grid.appendChild(card);
      });

      window.scrollTo(0, 0);
    }

    function openModal(product) {
      const modal = document.getElementById("modal");
      document.getElementById("modal-img").src = product.image || product.imageUrl || FALLBACK_IMG;
      document.getElementById("modal-title").textContent = product.name || "";
      document.getElementById("modal-desc").textContent = product.detail || product.description || "";

      const btnContado = document.getElementById("modal-buy-contado");
      const mainUrl = product.buyUrlContado || product.url || product.link;
     
      if (mainUrl) {
        btnContado.href = mainUrl;
        btnContado.textContent = product.buttonText || "Inscribirse";
        btnContado.style.display = "inline-flex";
      } else {
        btnContado.style.display = "none";
      }

      document.getElementById("modal-buy-3cuotas").style.display = product.buyUrl3Cuotas ? "inline-flex" : "none";
      if (product.buyUrl3Cuotas) document.getElementById("modal-buy-3cuotas").href = product.buyUrl3Cuotas;

      document.getElementById("modal-buy-6cuotas").style.display = product.buyUrl6Cuotas ? "inline-flex" : "none";
      if (product.buyUrl6Cuotas) document.getElementById("modal-buy-6cuotas").href = product.buyUrl6Cuotas;

      modal.classList.add("active");
    }

    function closeModal(event) {
      if (event) event.stopPropagation();
      document.getElementById("modal").classList.remove("active");
    }
  </script>

</body>
</html>
